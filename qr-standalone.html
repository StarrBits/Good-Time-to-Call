<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Time to Call - QR Code</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        #qrcode {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin: 20px 0;
            border: 2px solid #667eea;
        }

        .qr-info {
            color: #666;
            font-size: 14px;
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            flex: 1;
            min-width: 150px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-print {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-print:hover {
            background: #e0e0e0;
        }

        .url-display {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            word-break: break-all;
            color: #667eea;
            font-weight: 600;
        }

        @media print {
            body {
                background: white;
            }

            .container {
                box-shadow: none;
                border: none;
            }

            .button-group,
            .subtitle,
            .qr-info,
            .url-display {
                display: none;
            }

            h1 {
                margin-bottom: 20px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            button {
                min-width: 120px;
                padding: 10px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Good Time to Call</h1>
        <p class="subtitle">Scan to Visit the Website</p>

        <div id="qrcode"></div>

        <div class="qr-info">
            <p>📱 Scan this QR code with your phone to visit IsItAGoodTimetoCall.com</p>
            <p style="margin-top: 10px; font-size: 12px;">Perfect for ads, flyers, print materials, and more!</p>
        </div>

        <div class="url-display">
            http://isitagoodtimetocall.com/
        </div>

        <div class="button-group">
            <button class="btn-download" onclick="downloadQR()">📥 Download QR Code</button>
            <button class="btn-print" onclick="window.print()">🖨️ Print</button>
        </div>
    </div>

    <script>
        // Generate QR code
        const qrcode = new QRCode(document.getElementById('qrcode'), {
            text: 'http://isitagoodtimetocall.com/',
            width: 300,
            height: 300,
            colorDark: '#000000',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        // Download QR code as PNG
        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            const url = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = url;
            link.download = 'IsItAGoodTimetoCall-QR-Code.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
